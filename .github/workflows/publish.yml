name: publish

# 版は release の tag が決める。package.json を手で bump する手順は無い。
#   gh release create 0.1.3 --generate-notes
# で release を公開するとこの workflow が走る。やること:
#   resolve  tag から版を引く（先頭の v は剥がす。tag が版でない形はここで落とす）
#   sync     main の apps/otenki/package.json と bun.lock をその版に直して push
#   build    その版で pack → 型検査とテスト → 取り出した tarball を実際に起動
#   release  tarball をその release に添付
#   npm      npm publish --provenance
on:
  # 公開（published）された release が作動源。タグの push は見ない ——
  # release を作るコマンドはタグも push するので、両方を受けると 1 回の release で
  # 2 本走って、2 本目の npm publish が「その版は既に存在する」で必ず落ちる。
  release:
    types: [published]
  # release は既に公開済みで、この release の再実行だけしたいとき用。
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のタグ（例: 0.1.0 / v0.1.0）"
        required: true
        type: string

permissions:
  contents: read

# 取消しはしない。publish は 2 系統（release への添付 / npm）に分かれるので、
# 片方だけ止めて片方が進むより、release を消して初めからやり直す。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKDIR: apps/otenki

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      branch: ${{ steps.pick.outputs.branch }}
    steps:
      # 版は tag から引くので、この job は repo を取り出さない。
      - name: pick the tag
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # release イベントでは GITHUB_REF がその release のタグを指すので、
          # push のときと同じ読み方で取れる。dispatch だけ明示入力を優先する。
          tag="${REF_NAME}"
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          fi

          # v0.1.0 でも 0.1.0 でも受ける。英数字の版だけを許して、
          # nightly のようなタグを package.json に書き込まない。
          version="${tag#v}"
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${tag} is not a version tag"
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "branch=${DEFAULT_BRANCH}"
          } >> "$GITHUB_OUTPUT"

  # 版の持ち主は tag になったので、git にはこの job が書き戻す。
  # publish 3 系統とは独立で、書けなくても release と npm は進む。
  sync:
    needs: resolve
    name: sync version to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # tag の commit は push しない。main を取り直して、そこから直す。
          ref: ${{ needs.resolve.outputs.branch }}
          # 取り直して rebase するので、全履歴を持つ。
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          # devShell / ci.yml / deploy-docs.yml と同じ版に揃える。
          bun-version: 1.4.2

      - uses: ./.github/actions/sync-version
        with:
          version: ${{ needs.resolve.outputs.version }}

      - name: commit and push
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 同じ版を 2 回走らせても 2 回目の commit を作らない。
          if git diff --quiet -- apps/otenki/package.json bun.lock; then
            echo "main is already at ${VERSION}, nothing to push"
            exit 0
          fi

          git add apps/otenki/package.json bun.lock
          git commit -m "chore(release): version ${VERSION} from tag ${TAG}"

          # 誰かが先に push していたら取り直して 1 回だけやり直す。
          for _ in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
          done
          echo "::error::could not push the version bump to ${BRANCH}"
          exit 1

  # publish の前に必ずここを通す。テストが落ちていない npm tarball を作らない。
  build:
    needs: resolve
    name: build and test the tarball
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
        with:
          # resolve と同じ commit を切り出す。release でも dispatch でも main ではなく
          # タグの commit に対して publish する。
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # devShell / ci.yml / deploy-docs.yml と同じ版に揃える。
          bun-version: 1.4.2

      # tag の commit の package.json は版が古いことがある。install より前に直す。
      # 直さないと frozen-lockfile が「lockfile had changes」で落ちる。
      - uses: ./.github/actions/sync-version
        with:
          version: ${{ needs.resolve.outputs.version }}

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck and test
        working-directory: ${{ env.WORKDIR }}
        run: bun run typecheck && bun test

      # files フィールドが効いているかの確認も兼ねる。tarball に test/ や
      # tsconfig.json が入っていたら、ここで落とす。
      - name: pack
        id: pack
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          # ファイル名は scope 込み（nazozokc-prod-otenki-…）なので、
          # glob は tgz 拡張子だけで合わせる。名前が変わっても壊れない。
          echo "tarball=$(ls "$RUNNER_TEMP"/*.tgz)" >> "$GITHUB_OUTPUT"

      # 取り出した tarball を実際に起動する。npm が bin に exec bit を付けることと、
      # version.ts が ../package.json を読んで版を出せることを確認する。
      - name: smoke test the packed tarball
        run: |
          npm install -g --prefix "$RUNNER_TEMP/prefix" "${{ steps.pack.outputs.tarball }}"
          "$RUNNER_TEMP/prefix/bin/otenki" --version
          "$RUNNER_TEMP/prefix/bin/otenki" --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  release:
    needs: [resolve, build]
    name: github release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # gh は GITHUB_TOKEN も読むが、書込み権限の借用であることを明示しておく。
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: ${{ runner.temp }}

      # この workflow は published な release で起動するので、release は既に存在する。
      # やるのは npm tarball の添付だけ。--clobber で同名アセットを置き換えるので、
      # 同じタグを再 dispatch しても二重添付にならない。notes は書き換えない。
      - name: attach the tarball
        run: |
          gh release upload "${{ needs.resolve.outputs.tag }}" \
            "${{ needs.build.outputs.tarball }}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  npm:
    needs: [resolve, build]
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # --provenance は OIDC で署名を取り直すため、この権限が無いと publish が
      # 失敗する。long-lived token ではなく、短命の identity で証明される。
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # resolve と同じ commit を切り出す。dispatch でも main ではなく
          # タグの package.json に対して publish する。
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # publish する版は tag が決める。checkout した commit の package.json を
      # そのまま使うと、main より古い版が npm に載る。
      - uses: ./.github/actions/sync-version
        with:
          version: ${{ needs.resolve.outputs.version }}

      # job の if: では secrets コンテキストが使えない（actionlint が指摘する）。
      # 判定は step に落とす。NPM_TOKEN は secret で持つ。token が未設定なら
      # npm だけを飛ばして GitHub Release は出す。OIDC 認証（trusted publishing）
      # へ移すには npmjs.com 側で workflow 名を登録し、この判定ごと消す。
      - name: check for the npm token
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set, so the npm publish is skipped."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: publish
        if: steps.token.outputs.found == 'true'
        working-directory: ${{ env.WORKDIR }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
